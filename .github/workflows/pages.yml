# Publishes the site to GitHub Pages (ce-tee.com) on every push to main.
# GitHub Pages only serves files, so the trips come from data/trips.sample.json
# and accounts / admin / booking stay off until a backend is connected.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the static site
        run: |
          mkdir -p _site
          cp -r public/. _site/
          cp data/trips.sample.json _site/trips.json
          rm -f _site/admin.html _site/account.html _site/account.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
